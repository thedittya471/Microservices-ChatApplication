services:
  postgres:
    image: postgres:17-alpine
    container_name: chatapp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-chatapp_auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-chatapp_auth_password}
      POSTGRES_DB: ${AUTH_DB_NAME:-chatapp_auth_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
